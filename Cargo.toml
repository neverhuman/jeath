[package]
name = "authority-lab"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Small reproducible experiments for Intelligence Is Not Authority"

[dependencies]
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.release]
debug = "line-tables-only"

