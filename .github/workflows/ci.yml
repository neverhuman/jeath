name: Required checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ci-source

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: '2'

jobs:
  rust-linux:
    name: Rust (Linux shared)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          path: ci-source
      - name: Record selected runner
        run: printf 'runner=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
      - name: Prepare CPU tools in disposable Ubuntu guest
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true
          sudo systemd-run --quiet --wait --property=After=apt-daily.service --property=After=apt-daily-upgrade.service /bin/true || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install --no-install-recommends -y rustup build-essential pkg-config python3 python3-numpy python3-scipy python3-matplotlib python3-openpyxl python3-pandas python3-pil unzip
      - name: Install Rust components
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Format, lint and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Small complete experiment run
        run: |
          python3 scripts/run.py target/ci-evidence --quick
          python3 scripts/validate.py target/ci-evidence
      - name: Verified core, Linux boundary and separate-service protocol
        run: |
          python3 scripts/run_v2.py target/ci-v2 --profile smoke
          python3 scripts/analyze_v2.py target/ci-v2 --source
      - name: Pure-Rust V3 mechanism, graph, coverage, monitor and selection suite
        run: |
          python3 scripts/run_v3.py target/ci-v3 --quick --no-build
          python3 scripts/validate_v3.py target/ci-v3 --source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: experiments-linux-shared
          path: |
            ci-source/target/ci-evidence/*.json
            ci-source/target/test-evidence/**/result.json
            ci-source/target/ci-v2/**/*.json
            ci-source/target/ci-v3/*.json
          if-no-files-found: error
          retention-days: 30

  rust-macos:
    name: Rust (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          path: ci-source
      - name: Install Rust components
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Format, lint and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Small complete experiment run
        run: |
          python3 scripts/run.py target/ci-evidence --quick
          python3 scripts/validate.py target/ci-evidence
          python3 scripts/run_v3.py target/ci-v3 --quick --no-build
          python3 scripts/validate_v3.py target/ci-v3 --source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: experiments-macos
          path: |
            ci-source/target/ci-evidence/*.json
            ci-source/target/test-evidence/**/result.json
            ci-source/target/ci-v3/*.json
          if-no-files-found: error
          retention-days: 30

  paper:
    name: Paper and recorded evidence
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on:
      group: neverhuman-lan
      labels: [self-hosted, Linux, X64, lan-ci, ubuntu24]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
          path: ci-source
      - name: Record selected runner
        run: printf 'runner=%s os=%s arch=%s\n' "$RUNNER_NAME" "$RUNNER_OS" "$RUNNER_ARCH"
      - name: Install TeX and scientific Python in disposable Ubuntu guest
        run: |
          sudo systemctl stop apt-daily.timer apt-daily-upgrade.timer || true
          sudo systemd-run --quiet --wait --property=After=apt-daily.service --property=After=apt-daily-upgrade.service /bin/true || true
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install --no-install-recommends -y python3 python3-numpy python3-scipy python3-matplotlib python3-openpyxl python3-pandas python3-pil texlive-latex-recommended texlive-latex-extra texlive-publishers texlive-fonts-recommended texlive-science texlive-pictures latexmk poppler-utils
      - name: Check source preservation, generated numbers and PDFs across studies
        run: |
          python3 scripts/validate.py evidence/reference --source-ref 12b5579
          python3 scripts/analyze_v2.py evidence/v2/reference --source
          python3 scripts/validate_v3.py evidence/v3/reference --source
          python3 scripts/paper.py --check
          python3 scripts/build_paper.py
          python3 scripts/validate.py evidence/reference --study performance-before-outcomes --source
          python3 scripts/paper.py --study performance-before-outcomes
          python3 scripts/paper.py --study performance-before-outcomes --check
          python3 scripts/build_paper.py --study performance-before-outcomes
          python3 scripts/validate.py evidence/brain/reference --study minds-we-choose --source
          python3 scripts/paper.py --study minds-we-choose
          python3 scripts/paper.py --study minds-we-choose --check
          python3 scripts/build_paper.py --study minds-we-choose
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manuscript
          path: |
            ci-source/docs/intelligence-is-not-authority.pdf
            ci-source/target/paper-build/*.log
            ci-source/target/performance-before-outcomes/performance-before-outcomes.pdf
            ci-source/target/minds-we-choose/*.pdf
          if-no-files-found: error
          retention-days: 30
