name: Required checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_BUILD_JOBS: '2'

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Rust components
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.95.0
      - name: Format, lint and tests
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace --all-targets
          python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Small complete experiment run
        run: |
          python3 scripts/run.py target/ci-evidence --quick
          python3 scripts/validate.py target/ci-evidence
      - name: Verified core, Linux boundary and separate-service protocol
        if: runner.os == 'Linux'
        run: |
          python3 scripts/run_v2.py target/ci-v2 --profile smoke
          python3 scripts/analyze_v2.py target/ci-v2 --source
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: experiments-${{ matrix.os }}
          path: |
            target/ci-evidence/*.json
            target/test-evidence/**/result.json
            target/ci-v2/**/*.json
          if-no-files-found: error
          retention-days: 30

  paper:
    name: Paper and recorded evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install TeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y texlive-latex-extra texlive-fonts-recommended texlive-science texlive-pictures latexmk poppler-utils
      - name: Check source preservation, generated numbers and PDF
        run: |
          python3 scripts/validate.py evidence/reference --source-ref 12b5579
          python3 scripts/analyze_v2.py evidence/v2/reference --source
          python3 scripts/paper.py --check
          python3 scripts/build_paper.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: manuscript
          path: |
            docs/intelligence-is-not-authority.pdf
            target/paper-build/*.log
          if-no-files-found: error
          retention-days: 30
